</head>

<body>

  ========================================================== -->

            <line

              y1="16"
              x2="30"
              y2="16"

          </span>

          </span>

      <nav class="sidebar-nav">

        <button

        >

          <svg
            class="nav-icon"

        <button
          class="nav-item"

          title="Live Cameras"
        >

          <svg
            class="nav-icon"
            viewBox="0 0 24 24"
            fill="none"

            stroke-width="2"
          >

            <path d="M23 7l-7 5 7 5V7z" />

            <rect
              x="1"

              width="15"
              height="14"
              rx="2"
            />

          </svg>

          <span>Live Cameras</span>

          <span
            class="nav-badge"
            id="active-cam-badge"
          >
            0
          </span>

        </button>


        <!-- Persons -->

        <button

          </svg>

        <button

        >

          <svg
            class="nav-icon"

          >

              y2="16.65"
            />

          </svg>

          <span>Identity Search</span>

        </button>

        <button
          class="nav-item"
          data-page="timeline"
          title="Movement Timeline"
        >

          <svg
            class="nav-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >

            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />

            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >

            <path
              d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"
            />

            <path
              d="M13.73 21a2 2 0 0 1-3.46 0"

          <span>Alerts</span>

          <span
            class="nav-badge alert-badge"

            <polyline points="16 16 12 12 8 16" />

            />

            <path
              d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"
            />

          </svg>

          <span>Upload Footage</span>

        </button>


        <!-- Analytics -->

        <button
          class="nav-item"

      ====================================================== -->

      <div class="sidebar-footer">

          <span class="status-dot pulse"></span>

          <span>

          </span>

        </div>


        <div
          class="ws-status"
          id="ws-status"
        >

          <span
            class="status-dot"
            id="ws-dot"
          ></span>

          <span id="ws-label">
            Connecting…
          </span>

        </div>

      </div>

    </aside>



    <!-- =======================================================
         MAIN CONTENT
    ======================================================== -->

    <main class="main-content">


      <!-- =====================================================
           TOP BAR
      ====================================================== -->

      <header class="top-bar">


        <div class="top-bar-left">

          <h1
            class="page-title"
            id="page-title"
          >
            ReUnite Dashboard
          </h1>

          <span
            class="page-subtitle"
            id="page-subtitle"
          >
            AI-powered missing person intelligence and surveillance overview
          </span>

        </div>


        <div class="top-bar-right">


          <!-- Date / Time -->

          <div
            class="datetime-display"
            id="datetime-display"
          ></div>


          <!-- Alert Bell -->

          <button
            class="icon-btn"
            id="alert-bell"
            title="Alerts"
            aria-label="Open alerts"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >

              <path
                d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"
              />

              <path
                d="M13.73 21a2 2 0 0 1-3.46 0"
              />

            </svg>

            <span
              class="bell-dot hidden"
              id="bell-dot"
            ></span>

          </button>


          <!-- User -->

          <div class="user-chip">

            <div class="user-avatar">
              A
            </div>

            <span>
              Admin
            </span>

          </div>

        </div>

      </header>



      <!-- =====================================================
           TOAST NOTIFICATIONS
      ====================================================== -->

      <div id="toast-container"></div>



      <!-- =====================================================

      ====================================================== -->

      <div

      </div>


      <div
        class="page"
        id="page-cameras"
      >

      </div>


      <div
        class="page"

      <div
        class="page"

      </div>


      <div
        class="page"

      >

      </div>

  </div>



  <!-- =========================================================

  ========================================================== -->

  <script src="src/api.js"></script>

  <script src="src/app.js"></script>


</body>
